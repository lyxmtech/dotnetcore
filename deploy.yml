name: Deploy to Amazon ECS

on:
  push:
    branches: [ "main" ] # Triggered when code is pushed to main branch

permissions:
  id-token: write # Required for OIDC authentication
  contents: read  # Required for checkout code

env:
  AWS_REGION: us-east-1                   # Your AWS region
  ECR_REPOSITORY: my-app                  # Your ECR repository name
  ECS_SERVICE: my-app-service             # Your ECS service name
  ECS_CLUSTER: my-cluster                 # Your ECS cluster name
  ECS_TASK_DEFINITION: task-definition.json # Path to task definition file
  CONTAINER_NAME: app-container           # Container name in task definition

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production # Optional: if you have configured a GitHub environment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_ACCOUNT_ID:role/GitHubActionsECSRole # Replace with your IAM role ARN
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true