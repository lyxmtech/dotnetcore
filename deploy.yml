name: Deploy services to Amazon ECS

on:
  push:
    branches: [ "main" ] # Triggered when code is pushed to main branch

permissions:
  id-token: write # Required for OIDC authentication
  contents: read  # Required for checkout code

env:
  AWS_REGION: us-east-1                   # Your AWS region

jobs:
  deploy:
    name: Build & Deploy ${{ matrix.service.display }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { display: DemoHost,     project: DemoHost,     dockerfile: DemoHost/Dockerfile,     ecr_repository: dotnetcore-demo,   ecs_service: dotnetcore-demo-service,   container_name: demo,   task_definition: aws/task-definitions/demo.json }
          - { display: HelloService, project: HelloService, dockerfile: HelloService/Dockerfile, ecr_repository: dotnetcore-hello,  ecs_service: dotnetcore-hello-service,  container_name: hello,  task_definition: aws/task-definitions/hello.json }
          - { display: AuditService, project: AuditService, dockerfile: AuditService/Dockerfile, ecr_repository: dotnetcore-audit,  ecs_service: dotnetcore-audit-service,  container_name: audit,  task_definition: aws/task-definitions/audit.json }
          - { display: NotifyService, project: NotifyService, dockerfile: NotifyService/Dockerfile, ecr_repository: dotnetcore-notify, ecs_service: dotnetcore-notify-service, container_name: notify, task_definition: aws/task-definitions/notify.json }
    environment: production # Optional: if you have configured a GitHub environment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_ACCOUNT_ID:role/GitHubActionsECSRole # Replace with your IAM role ARN
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ matrix.service.ecr_repository }}
        run: |
          docker build -f ${{ matrix.service.dockerfile }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ matrix.service.task_definition }}
          container-name: ${{ matrix.service.container_name }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.service.ecs_service }}
          cluster: dotnetcore-cluster
          wait-for-service-stability: true
