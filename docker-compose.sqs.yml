services:
  # Option C: MassTransit + Amazon SQS/SNS via LocalStack across separate containers.
  # Run: docker compose -f docker-compose.sqs.yml up -d --build
  localstack:
    image: localstack/localstack:3
    ports: ["4566:4566"]
    environment:
      - SERVICES=sqs,sns
      - DEFAULT_REGION=us-east-2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  hello:
    build:
      context: .
      dockerfile: ./HelloService/Dockerfile
    ports: ["5000:8080"]
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - EventBus=SQS
      - Database__Path=/data/hello.db
      - Sqs__Region=us-east-2
      - Sqs__ServiceUrl=http://localstack:4566
      - Sqs__AccessKey=test
      - Sqs__SecretKey=test
    volumes:
      - hello-data:/data
    depends_on:
      localstack:
        condition: service_healthy

  audit:
    build:
      context: .
      dockerfile: ./AuditService/Dockerfile
    ports: ["5001:8080"]
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - EventBus=SQS
      - Database__Path=/data/audit.db
      - Sqs__Region=us-east-2
      - Sqs__ServiceUrl=http://localstack:4566
      - Sqs__AccessKey=test
      - Sqs__SecretKey=test
    volumes:
      - audit-data:/data
    depends_on:
      localstack:
        condition: service_healthy

  notify:
    build:
      context: .
      dockerfile: ./NotifyService/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - EventBus=SQS
      - Sqs__Region=us-east-2
      - Sqs__ServiceUrl=http://localstack:4566
      - Sqs__AccessKey=test
      - Sqs__SecretKey=test
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  hello-data:
  audit-data: