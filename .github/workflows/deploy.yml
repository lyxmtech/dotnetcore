name: Deploy services to Amazon ECS

on:
  workflow_dispatch:       # Manual runs from the GitHub Actions tab
    inputs:
      service:
        description: 'Service to deploy (all = every service)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - demo
          - hello
          - audit
          - notify

permissions:
  id-token: write # Required for OIDC authentication
  contents: read  # Required for checkout code

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  prepare:
    name: Prepare deploy matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute matrix from input
        id: set-matrix
        env:
          INPUT_SERVICE: ${{ github.event.inputs.service }}
        run: |
          python3 <<'PY'
          import json, os
          svc = (os.environ.get("INPUT_SERVICE") or "all").strip().lower()
          slugs = [svc] if svc in ("demo", "hello", "audit", "notify") else ["demo", "hello", "audit", "notify"]
          services = {
            "demo":   {"slug":"demo",   "display":"DemoHost",     "project":"DemoHost",     "dockerfile":"DemoHost/Dockerfile",     "ecr_repository":"dotnetcore-demo",   "ecs_service":"dotnetcore-demo-service",   "container_name":"demo",   "task_definition":"aws/task-definitions/demo.json"},
            "hello":  {"slug":"hello",  "display":"HelloService", "project":"HelloService", "dockerfile":"HelloService/Dockerfile", "ecr_repository":"dotnetcore-hello",  "ecs_service":"dotnetcore-hello-service",  "container_name":"hello",  "task_definition":"aws/task-definitions/hello.json"},
            "audit":  {"slug":"audit",  "display":"AuditService", "project":"AuditService", "dockerfile":"AuditService/Dockerfile", "ecr_repository":"dotnetcore-audit",  "ecs_service":"dotnetcore-audit-service",  "container_name":"audit",  "task_definition":"aws/task-definitions/audit.json"},
            "notify": {"slug":"notify", "display":"NotifyService","project":"NotifyService","dockerfile":"NotifyService/Dockerfile","ecr_repository":"dotnetcore-notify","ecs_service":"dotnetcore-notify-service","container_name":"notify","task_definition":"aws/task-definitions/notify.json"},
          }
          matrix = {"service": [services[s] for s in slugs]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps(matrix) + "\n")
          PY

  deploy:
    name: Build & Deploy ${{ matrix.service.display }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    environment: production # Optional: if you have configured a GitHub environment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate AWS role configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12} ]]; then
            echo "Set the AWS_ACCOUNT_ID repository variable to your 12-digit AWS account ID." >&2
            exit 1
          fi

          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/.+$ ]]; then
            echo "Set AWS_ROLE_ARN to the GitHub Actions IAM role ARN in AWS account ${AWS_ACCOUNT_ID}." >&2
            exit 1
          fi

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ matrix.service.ecr_repository }}
        run: |
          docker build -f ${{ matrix.service.dockerfile }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Prepare ECS task definition
        id: prepare-task-definition
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          EFS_FILE_SYSTEM_ID: ${{ vars.EFS_FILE_SYSTEM_ID }}
          EFS_ACCESS_POINT_ID: ${{ vars.EFS_ACCESS_POINT_ID }}
        run: |
          set -euo pipefail

          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "Set the AWS_ACCOUNT_ID repository variable to your 12-digit AWS account ID." >&2
            exit 1
          fi

          execution_role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/ecsTaskExecutionRole"
          task_role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/ecsTaskRole"

          task_definition="${{ matrix.service.task_definition }}"
          output="${{ matrix.service.slug }}-task-definition.json"
          jq \
            --arg executionRoleArn "$execution_role_arn" \
            --arg taskRoleArn "$task_role_arn" \
            '.executionRoleArn = $executionRoleArn | .taskRoleArn = $taskRoleArn' \
            "$task_definition" > "$output"

          if [[ "${{ matrix.service.slug }}" == "audit" ]]; then
            if [[ -z "$EFS_FILE_SYSTEM_ID" || -z "$EFS_ACCESS_POINT_ID" ]]; then
              echo "Set the EFS_FILE_SYSTEM_ID and EFS_ACCESS_POINT_ID repository variables before deploying AuditService." >&2
              exit 1
            fi

            jq --arg fileSystemId "$EFS_FILE_SYSTEM_ID" \
              --arg accessPointId "$EFS_ACCESS_POINT_ID" \
              '(.volumes[] | select(.name == "audit-data").efsVolumeConfiguration) |=
                (.fileSystemId = $fileSystemId |
                 .authorizationConfig.accessPointId = $accessPointId)' \
              "$output" > "${output}.tmp"
            mv "${output}.tmp" "$output"
          fi

          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.prepare-task-definition.outputs.path }}
          container-name: ${{ matrix.service.container_name }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.service.ecs_service }}
          cluster: dotnetcore-cluster
          wait-for-service-stability: true
