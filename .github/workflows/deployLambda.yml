name: Deploy AuditLambda

on:
  # push:
  # branches: [main]
  # paths:
  #   - "AuditLambda/**"
  #   - ".github/workflows/deployLambda.yml"
  workflow_dispatch: {}

concurrency:
  group: audit-lambda-deploy
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  LAMBDA_FUNCTION_NAME: AuditAuditCount
  LAMBDA_RUNTIME: dotnet10
  LAMBDA_HANDLER: AuditLambda::AuditLambda.Function::FunctionHandlerAsync
  PROJECT_PATH: AuditLambda/AuditLambda.csproj
  AWS_REGION: us-east-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore packages
        run: dotnet restore "${{ env.PROJECT_PATH }}" --runtime linux-x64

      - name: Build Release
        run: dotnet build "${{ env.PROJECT_PATH }}" -c Release --runtime linux-x64 --no-restore

      - name: Publish Lambda package
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c Release --runtime linux-x64 --self-contained false --no-build --no-restore -o publish

      - name: Create deployment zip
        run: |
          cd publish
          zip -r ../AuditLambda.zip .

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuditLambda-deploy-zip
          path: AuditLambda.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for existing Lambda update
        run: aws lambda wait function-updated --function-name "${{ env.LAMBDA_FUNCTION_NAME }}"

      - name: Configure Lambda runtime, handler, VPC, and EFS
        env:
          EFS_FILE_SYSTEM_ID: ${{ vars.EFS_FILE_SYSTEM_ID }}
          EFS_ACCESS_POINT_ID: ${{ vars.EFS_ACCESS_POINT_ID }}
          LAMBDA_SUBNET_IDS: ${{ vars.LAMBDA_SUBNET_IDS }}
          LAMBDA_SECURITY_GROUP_IDS: ${{ vars.LAMBDA_SECURITY_GROUP_IDS }}
        run: |
          set -euo pipefail

          for name in EFS_FILE_SYSTEM_ID EFS_ACCESS_POINT_ID LAMBDA_SUBNET_IDS LAMBDA_SECURITY_GROUP_IDS; do
            if [[ -z "${!name}" ]]; then
              echo "Set the $name repository variable before deploying AuditLambda." >&2
              exit 1
            fi
          done

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          access_point_file_system_id="$(
            aws efs describe-access-points \
              --access-point-id "${EFS_ACCESS_POINT_ID}" \
              --query 'AccessPoints[0].FileSystemId' \
              --output text
          )"
          if [[ "$access_point_file_system_id" != "$EFS_FILE_SYSTEM_ID" ]]; then
            echo "EFS_ACCESS_POINT_ID does not belong to EFS_FILE_SYSTEM_ID." >&2
            exit 1
          fi

          access_point_arn="arn:aws:elasticfilesystem:${AWS_REGION}:${account_id}:access-point/${EFS_ACCESS_POINT_ID}"

          aws lambda get-function-configuration \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --query 'Environment.Variables' \
            --output json |
            jq '(. // {}) + {"AUDIT_DB_PATH":"/mnt/audit/audit.db"} | {Variables:.}' \
              > lambda-environment.json

          aws lambda update-function-configuration \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --runtime "${LAMBDA_RUNTIME}" \
            --handler "${LAMBDA_HANDLER}" \
            --environment file://lambda-environment.json \
            --file-system-configs "Arn=${access_point_arn},LocalMountPath=/mnt/audit" \
            --vpc-config "SubnetIds=${LAMBDA_SUBNET_IDS},SecurityGroupIds=${LAMBDA_SECURITY_GROUP_IDS}"

      - name: Wait for Lambda configuration update
        run: aws lambda wait function-updated --function-name "${{ env.LAMBDA_FUNCTION_NAME }}"

      - name: Deploy Lambda zip
        run: aws lambda update-function-code --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" --zip-file fileb://AuditLambda.zip --publish

      - name: Wait for Lambda code update
        run: aws lambda wait function-updated --function-name "${{ env.LAMBDA_FUNCTION_NAME }}"
